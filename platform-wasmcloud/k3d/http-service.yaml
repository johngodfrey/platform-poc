apiVersion: v1
kind: Service
metadata:
  name: platform-poc-http
  namespace: wasm
spec:
  # This setup runs the application's HTTP provider on every selected host,
  # listening on 8080. Let Kubernetes track pod readiness and IP changes.
  selector:
    app.kubernetes.io/name: wasmcloud
    app.kubernetes.io/instance: wasmcloud-host
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
